[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsagent"
version = "1.0.0"
description = "Autonomous knowledge execution agent for e-commerce operations (LangGraph + Groq)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shubh Bohra" }]
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langchain-core>=1.6,<2",
  "langchain-groq>=1.1,<2",
  "langchain-google-genai>=4.4,<5",
  "chromadb>=1.5,<2",
  "pydantic>=2.13,<3",
  "typer>=0.27",
  "rich>=15",
  "python-dotenv>=1.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.64"]
dev = ["pytest>=9", "ruff>=0.16"]

[project.scripts]
opsagent = "opsagent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsagent = ["schema.sql", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real LLM provider (excluded by default)"]
addopts = "-m 'not live' -q"
